<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
  </head>
  <body>
    <script>
      // Оформление пользователя: сразу ставим выбранный режим, чтобы не было «мигания».
      (function () {
        try {
          var mode = localStorage.getItem('barakatcrm_theme') || localStorage.getItem('barakatcrm_style_mode');
          if (mode === 'light') { document.documentElement.classList.remove('dark'); }
          else { document.documentElement.classList.add('dark'); }
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
