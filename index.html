<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
  </head>
  <body>
    <script>
      // По умолчанию — светлый режим. Тёмный — только если пользователь явно выбрал его ранее.
      (function () {
        try {
          var t = localStorage.getItem('barakatcrm_theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else { document.documentElement.classList.remove('dark'); localStorage.setItem('barakatcrm_theme', 'light'); }
        } catch (e) { document.documentElement.classList.remove('dark'); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
